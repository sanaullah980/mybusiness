<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- AUTH LOADING SCREEN -->
    <div id="auth-loading" class="auth-loading">
        <div class="spinner"></div>
        <p>Checking authentication...</p>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="hidden">
        <div class="landing-container">
            <div class="landing-text">
                <h1>Professional Shop & Business Management</h1>
                <p>Track inventory, manage sales, monitor daily profit, and handle customer debt securely.</p>
            </div>
            <div class="login-box">
                <h2>Welcome Back</h2>
                <div id="login-error" class="error-msg"></div>
                <form onsubmit="handleAuth(event)">
                    <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    <button type="submit" id="auth-button">Log In</button>
                </form>
                <div class="divider">OR</div>
                <button class="google-btn" onclick="signInWithGoogle()">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                <p class="toggle-text" id="toggle-auth" onclick="toggleAuthMode()">Don't have an account? Sign Up</p>
                <p class="toggle-text" style="color: var(--gray); font-size: 12px; margin-top: 10px;" onclick="forgotPassword(event)">Forgot Password?</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
        <header class="app-header">
            <h1 id="header-title">Dashboard</h1>
            <div style="display:flex; align-items:center; gap:5px;">
                <span id="connection-indicator" class="connection-indicator online" title="Online"><i class="fas fa-wifi"></i></span>
                <button class="btn-icon" onclick="openGlobalSearchModal()" title="Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="btn-icon" onclick="handleLogout()" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main id="app-content">
            <!-- Content injected by app.js -->
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" data-page="sales" onclick="navigate('sales')">
                <i class="fas fa-cash-register"></i>
                <span>Sales</span>
            </button>
            <button class="nav-item" data-page="inventory" onclick="navigate('inventory')">
                <i class="fas fa-boxes"></i>
                <span>Inventory</span>
            </button>
            <button class="nav-item" data-page="customers" onclick="navigate('customers')">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </button>
            <button class="nav-item" data-page="more" onclick="navigate('more')">
                <i class="fas fa-ellipsis-h"></i>
                <span>More</span>
            </button>
        </nav>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-content" id="modal-body">
            <!-- Modal content injected by modules -->
        </div>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
