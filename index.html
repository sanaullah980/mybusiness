<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Management System | Inventory, Sales & Shop Management</title>
    <meta name="description" content="Professional business management system for shop owners. Track inventory, manage daily sales, monitor profits, and handle customer debt securely.">
    <link rel="canonical" href="https://mybusiness-green.vercel.app/">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>

    <div id="auth-loading" class="auth-loading">
        <div class="spinner"></div>
        <p>Checking authentication...</p>
    </div>

    <div id="auth-screen" class="hidden">
        <div class="landing-container">
            <div class="landing-text">
                <h1>Professional Shop & Business Management</h1>
                <p>Track inventory, manage sales, monitor daily profit, and handle customer debt (udhaar) securely in one easy-to-use platform.</p>
            </div>
            <div class="login-box">
                <h2> Access Dashboard</h2>
                <div id="login-error" class="error-msg" role="alert"></div>
                <form id="auth-form" onsubmit="event.preventDefault(); handleAuth();">
                    <div class="form-group">
                        <label for="login-email" class="sr-only">Email Address</label>
                        <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="sr-only">Password</label>
                        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="auth-button">Log In</button>
                </form>
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="#" onclick="forgotPassword(event)" style="font-size: 13px; color: var(--primary); text-decoration: none;">Forgot password?</a>
                </div>
                <div class="divider">OR</div>
                <button type="button" class="google-btn" onclick="signInWithGoogle()" aria-label="Sign in with Google">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                <div class="toggle-text" id="toggle-auth" onclick="toggleAuthMode()" role="button" tabindex="0">Don't have an account? Sign Up</div>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="app-header">
            <h1 id="header-title">Dashboard</h1>
            <button class="btn-icon" onclick="handleLogout()" aria-label="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <main id="app-content" role="main"></main>

        <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
            <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')" aria-current="page">
                <i class="fas fa-chart-line"></i><span>Home</span>
            </button>
            <button class="nav-item" data-page="sales" onclick="navigate('sales')">
                <i class="fas fa-cash-register"></i><span>Sale</span>
            </button>
            <button class="nav-item" data-page="inventory" onclick="navigate('inventory')">
                <i class="fas fa-boxes-stacked"></i><span>Stock</span>
            </button>
            <button class="nav-item" data-page="more" onclick="navigate('more')">
                <i class="fas fa-bars"></i><span>More</span>
            </button>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)" role="dialog" aria-modal="true">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
