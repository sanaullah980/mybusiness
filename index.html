<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Management System | Inventory, Sales & Shop Management</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>

    <!-- AUTH LOADING SCREEN (Prevents Flash) -->
    <div id="auth-loading" class="auth-loading">
        <div class="spinner"></div>
        <p>Checking authentication...</p>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="hidden">
        <div class="landing-container">
            <div class="landing-text">
                <h1>Professional Shop & Business Management</h1>
                <p>Track inventory, manage sales, monitor daily profit, and handle customer debt (udhaar) securely in one easy-to-use platform.</p>
            </div>
            <div class="login-box">
                <h2>🔒 Access Dashboard</h2>
                <div id="login-error" class="error-msg" role="alert"></div>
                <form id="auth-form" data-mode="login" onsubmit="event.preventDefault(); handleAuth();">
                    <div class="form-group">
                        <label for="login-email" class="sr-only">Email Address</label>
                        <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="sr-only">Password</label>
                        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="auth-button">Log In</button>
                </form>
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="#" onclick="forgotPassword(event)" style="font-size: 13px; color: var(--primary); text-decoration: none;">Forgot password?</a>
                </div>
                <div class="divider">OR</div>
                <button type="button" class="google-btn" id="google-btn" onclick="signInWithGoogle()" aria-label="Sign in with Google">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                <div class="toggle-text" id="toggle-auth" onclick="toggleAuthMode()" role="button" tabindex="0">Don't have an account? Sign Up</div>
                
                <!-- Android App Download Link -->
                <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                    <a href="/downloads/mybusiness.apk" download class="btn" style="background: var(--dark); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                        <i class="fab fa-android"></i> 📱 Download Android App
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
        <header class="app-header">
            <h1 id="header-title">Dashboard</h1>
            <button class="btn-icon" onclick="handleLogout()" aria-label="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <main id="app-content" role="main"></main>

        <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
            <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')" aria-current="page">
                <i class="fas fa-chart-line"></i><span>Home</span>
            </button>
            <button class="nav-item" data-page="sales" onclick="navigate('sales')">
                <i class="fas fa-cash-register"></i><span>Sale</span>
            </button>
            <button class="nav-item" data-page="inventory" onclick="navigate('inventory')">
                <i class="fas fa-boxes-stacked"></i><span>Stock</span>
            </button>
            <button class="nav-item" data-page="more" onclick="navigate('more')">
                <i class="fas fa-bars"></i><span>More</span>
            </button>
        </nav>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)" role="dialog" aria-modal="true">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <!-- Main application loader: Load auth.js first, then app.js -->
    <script type="module">
        console.log('[loader] Application starting at', new Date().toISOString());

        // Global error handlers
        window.addEventListener('error', (e) => {
            try {
                console.error('[loader] Global error:', e.error || e.message, e.filename + ':' + e.lineno + ':' + e.colno);
                document.getElementById('auth-loading').classList.add('hidden');
                alert('Fatal error while loading the app. Check the console for details.');
            } catch (ignored) {}
        });

        window.addEventListener('unhandledrejection', (e) => {
            try {
                console.error('[loader] Unhandled promise rejection:', e.reason);
                document.getElementById('auth-loading').classList.add('hidden');
                alert('Unhandled promise rejection occurred. Check the console.');
            } catch (ignored) {}
        });

        // Load auth module first
        import('./modules/auth.js').then((authModule) => {
            console.log('[loader] auth.js loaded successfully');
            
            // Initialize auth listener - handles UI state based on login
            authModule.initializeAuthListener(async (user) => {
                console.log('[loader] User authenticated:', user.email);
                
                // Now load app module
                return import('./app.js').then((appModule) => {
                    console.log('[loader] app.js loaded successfully');
                    
                    // Initialize the app if function exists
                    if (window.initializeApp && typeof window.initializeApp === 'function') {
                        window.initializeApp();
                    }
                }).catch(err => {
                    console.error('[loader] Failed to load app.js:', err);
                    alert('Failed to load app module. See console for details.');
                });
            });
        }).catch(err => {
            console.error('[loader] Failed to load auth.js:', err);
            document.getElementById('auth-loading').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            alert('Failed to load authentication. Check the console and ensure Firebase config is correct.');
        });
    </script>

    <!-- Note: Modules are loaded dynamically by the loader above -->
</body>
</html>
