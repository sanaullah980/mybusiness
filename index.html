<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Manager Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Business Login</h2>
            <div id="login-error" class="error-msg"></div>
            <input type="email" id="login-email" placeholder="Email Address">
            <input type="password" id="login-password" placeholder="Password">
            <button id="auth-button" onclick="handleAuth()">Log In</button>
            
            <div class="divider">OR</div>
            
            <button class="google-btn" onclick="signInWithGoogle()">
                <i class="fab fa-google"></i> Sign in with Google
            </button>

            <div class="toggle-text" id="toggle-auth" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
        <header class="app-header">
            <h1 id="header-title">Dashboard</h1>
            <button class="btn-icon" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <main id="app-content">
            <!-- Dynamic Content Loads Here -->
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navigate('dashboard')">
                <i class="fas fa-chart-line"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" onclick="navigate('sales')">
                <i class="fas fa-cash-register"></i>
                <span>Sale</span>
            </button>
            <button class="nav-item" onclick="navigate('inventory')">
                <i class="fas fa-boxes-stacked"></i>
                <span>Stock</span>
            </button>
            <button class="nav-item" onclick="navigate('customers')">
                <i class="fas fa-users"></i>
                <span>People</span>
            </button>
            <button class="nav-item" onclick="navigate('settings')">
                <i class="fas fa-cog"></i>
                <span>More</span>
            </button>
        </nav>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-content" id="modal-body">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
